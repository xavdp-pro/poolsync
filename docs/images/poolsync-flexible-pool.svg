<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">A flexible PoolSync pool: hypothetical membership changes</title><desc id="desc">Fictitious example. Start with five configured peers, authorize and add desk-c to reach six, then temporarily take desk-c away. Five remain active and all six identities and layouts stay configured. Permanent retirement is a separate reviewed authorization and layout change.</desc><rect width="1440" height="620" fill="#f4f8fb"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="55" y="65" font-size="40" fill="#10243a" font-weight="700">A flexible PoolSync pool</text><text x="55" y="106" font-size="23" fill="#52677c" font-weight="400">Hypothetical scenarios · Fictitious computer names · No fixed five-computer limit</text><rect x="40" y="155" width="430" height="278" rx="15" fill="#fff" stroke="#d7e3ec"/><text x="62" y="199" font-size="23" fill="#10243a" font-weight="700">01  Start with five</text><rect x="60" y="230" width="120" height="48" rx="15" fill="#f0ebff" stroke="#d0c1f0"/><text x="75" y="261" font-size="20" fill="#7356c8" font-weight="600">desk-a</text><rect x="190" y="230" width="120" height="48" rx="15" fill="#f0ebff" stroke="#d0c1f0"/><text x="205" y="261" font-size="20" fill="#7356c8" font-weight="600">desk-b</text><rect x="60" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="75" y="326" font-size="20" fill="#087e87" font-weight="600">work-a</text><rect x="190" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="205" y="326" font-size="20" fill="#087e87" font-weight="600">work-b</text><rect x="320" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="335" y="326" font-size="20" fill="#087e87" font-weight="600">work-c</text><text x="62" y="389" font-size="23" fill="#10243a" font-weight="600">5 active · 5 configured</text><rect x="505" y="155" width="430" height="278" rx="15" fill="#fff" stroke="#d7e3ec"/><text x="527" y="199" font-size="23" fill="#10243a" font-weight="700">02  Authorize + add desk-c</text><rect x="525" y="230" width="120" height="48" rx="15" fill="#f0ebff" stroke="#d0c1f0"/><text x="540" y="261" font-size="20" fill="#7356c8" font-weight="600">desk-a</text><rect x="655" y="230" width="120" height="48" rx="15" fill="#f0ebff" stroke="#d0c1f0"/><text x="670" y="261" font-size="20" fill="#7356c8" font-weight="600">desk-b</text><rect x="785" y="230" width="120" height="48" rx="15" fill="#f0ebff" stroke="#d0c1f0"/><text x="800" y="261" font-size="20" fill="#7356c8" font-weight="600">desk-c</text><rect x="525" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="540" y="326" font-size="20" fill="#087e87" font-weight="600">work-a</text><rect x="655" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="670" y="326" font-size="20" fill="#087e87" font-weight="600">work-b</text><rect x="785" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="800" y="326" font-size="20" fill="#087e87" font-weight="600">work-c</text><text x="527" y="389" font-size="23" fill="#10243a" font-weight="600">6 active · 6 configured</text><rect x="970" y="155" width="430" height="278" rx="15" fill="#fff" stroke="#d7e3ec"/><text x="992" y="199" font-size="23" fill="#10243a" font-weight="700">03  Take desk-c away</text><rect x="990" y="230" width="120" height="48" rx="15" fill="#f0ebff" stroke="#d0c1f0"/><text x="1005" y="261" font-size="20" fill="#7356c8" font-weight="600">desk-a</text><rect x="1120" y="230" width="120" height="48" rx="15" fill="#f0ebff" stroke="#d0c1f0"/><text x="1135" y="261" font-size="20" fill="#7356c8" font-weight="600">desk-b</text><rect x="1250" y="230" width="120" height="48" rx="15" fill="#f0f1f5" stroke="#b4bfc9" stroke-dasharray="7 5"/><text x="1265" y="261" font-size="20" fill="#647487" font-weight="600">desk-c</text><rect x="990" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="1005" y="326" font-size="20" fill="#087e87" font-weight="600">work-a</text><rect x="1120" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="1135" y="326" font-size="20" fill="#087e87" font-weight="600">work-b</text><rect x="1250" y="295" width="120" height="48" rx="15" fill="#edf9f8" stroke="#c7e7e3"/><text x="1265" y="326" font-size="20" fill="#087e87" font-weight="600">work-c</text><text x="992" y="389" font-size="23" fill="#10243a" font-weight="600">5 active · 6 configured</text><text x="479" y="284" font-size="25" fill="#087e87" font-weight="700">→</text><text x="943" y="284" font-size="25" fill="#087e87" font-weight="700">→</text><rect x="40" y="460" width="1360" height="103" rx="15" fill="#eaf1ff" stroke="#cddcf5"/><text x="65" y="498" font-size="22" fill="#10243a" font-weight="400">Temporary departure keeps identity, settings and layout. Return without replaying private copies.</text><text x="65" y="535" font-size="19" fill="#52677c" font-weight="400">Permanent retirement is separate: update authorization, routes and layout. Remaining peers need usable network paths.</text><text x="55" y="601" font-size="18" fill="#52677c" font-weight="400">Purple: full-mode nodes · Teal: clipboard-only nodes · Dashed grey: configured but temporarily away</text></g></svg>
